<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#c1272d" />
<title>GTA Volunteer Check-in</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --primary: #c1272d;
    --primary-dark: #8b0e1a;
    --success: #198754;
    --warning: #f59e0b;
    --danger: #dc3545;
    --info: #185fa5;
    --bg: #fff8ec;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --shadow: 0 4px 14px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: linear-gradient(135deg, var(--primary), #ff6b35);
    color: white;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    box-shadow: var(--shadow);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; }
  header .meta { font-size: 12px; opacity: 0.9; }
  header button {
    padding: 6px 12px;
    background: rgba(255,255,255,0.2);
    color: white;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  header button:hover { background: rgba(255,255,255,0.3); }

  main { max-width: 720px; margin: 0 auto; padding: 16px; }

  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .card h2 { margin: 0 0 10px; font-size: 16px; color: var(--primary-dark); }

  /* Lock screen */
  #lockScreen {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }
  .lock-card {
    background: white;
    border-radius: 16px;
    padding: 36px 28px;
    width: 360px;
    max-width: calc(100vw - 32px);
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .lock-card .icon {
    width: 64px; height: 64px;
    margin: 0 auto 14px;
    background: var(--primary);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 30px;
  }
  .lock-card h2 { margin: 0 0 6px; font-size: 18px; color: var(--text); }
  .lock-card p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .lock-card input {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 10px;
  }
  .lock-card input.pin {
    text-align: center; letter-spacing: 2px;
  }
  .lock-card button {
    width: 100%;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .lock-card .err {
    color: var(--danger);
    font-size: 13px;
    margin-top: 12px;
    min-height: 18px;
  }

  /* Scanner */
  #scannerCard { padding: 0; overflow: hidden; }
  #qr-reader { width: 100%; min-height: 280px; background: #000; }
  #qr-reader video { display: block; max-width: 100%; }
  #qr-reader__dashboard { padding: 10px; background: #f5f7fb; }
  #qr-reader__camera_selection { font-size: 13px !important; padding: 6px !important; }

  .manual-entry {
    background: var(--card);
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    display: flex; gap: 8px;
  }
  .manual-entry input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: monospace;
    font-size: 14px;
  }
  .manual-entry button {
    padding: 10px 16px;
    background: var(--info);
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Volunteer card */
  .volunteer-card {
    border-left: 6px solid var(--info);
    padding: 18px;
  }
  .volunteer-card.checked-in { border-left-color: var(--success); background: #f0fdf4; }
  .volunteer-card.warning    { border-left-color: var(--warning); background: #fffbeb; }
  .volunteer-card .name {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 6px;
  }
  .volunteer-card .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .volunteer-card table { width: 100%; font-size: 13px; }
  .volunteer-card td { padding: 4px 0; vertical-align: top; }
  .volunteer-card td.label { color: var(--muted); width: 130px; padding-right: 12px; }
  .volunteer-card .medical {
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 6px;
    padding: 10px 12px;
    margin-top: 14px;
    font-size: 13px;
  }
  .volunteer-card .medical strong { color: #991b1b; }

  .actions {
    display: flex; gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .actions button {
    flex: 1;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    min-width: 120px;
  }
  .btn-primary { background: var(--success); color: white; }
  .btn-primary:hover { background: #146c43; }
  .btn-secondary { background: white; color: var(--text); border: 1px solid var(--border) !important; }
  .btn-secondary:hover { background: #f5f7fb; }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-left: 8px;
  }
  .badge-info    { background: #dbeafe; color: #1e3a8a; }
  .badge-success { background: #d1fae5; color: #065f46; }
  .badge-warning { background: #fef3c7; color: #92400e; }

  .status-banner {
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 14px;
    display: none;
  }
  .status-banner.success { background: #d1fae5; color: #065f46; display: block; }
  .status-banner.error   { background: #fee2e2; color: #991b1b; display: block; }
  .status-banner.warning { background: #fef3c7; color: #92400e; display: block; }

  .recent-list { font-size: 13px; }
  .recent-list .row {
    display: flex; justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed var(--border);
  }
  .recent-list .row:last-child { border-bottom: none; }
  .recent-list .name { font-weight: 600; }
  .recent-list .time { color: var(--muted); font-size: 11px; }
  .empty { text-align: center; padding: 18px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<!-- ============ LOCK SCREEN ============ -->
<div id="lockScreen">
  <form class="lock-card" id="lockForm">
    <div class="icon">🎫</div>
    <h2>GTA Volunteer Check-in</h2>
    <p>For GTA admins. Enter the admin PIN, then your name (so we record who checked in each volunteer).</p>
    <input type="text" id="adminNameInput" placeholder="Your name (e.g., Priya)" autocomplete="name" />
    <input type="password" id="pinInput" class="pin" placeholder="Admin PIN" autocomplete="off" />
    <button type="submit">Unlock</button>
    <div class="err" id="lockErr"></div>
  </form>
</div>

<!-- ============ MAIN APP (hidden until unlocked) ============ -->
<div id="appContent" style="display: none;">
  <header>
    <h1>🎫 Volunteer Check-in</h1>
    <div style="display: flex; align-items: center; gap: 10px;">
      <span class="meta" id="adminMeta">—</span>
      <button onclick="logout()">Lock</button>
    </div>
  </header>

  <main>
    <div id="statusBanner" class="status-banner"></div>

    <!-- Scanner -->
    <div class="card" id="scannerCard">
      <div id="qr-reader"></div>
      <div class="manual-entry">
        <input type="text" id="manualToken" placeholder="Or type token (e.g., CHK-A1B2…)" autocomplete="off" />
        <button onclick="lookupManual()">Look up</button>
      </div>
    </div>

    <!-- Volunteer details (shown after scan) -->
    <div id="volunteerArea"></div>

    <!-- Recent check-ins -->
    <div class="card">
      <h2>Recently checked in <span class="badge badge-success" id="recentCount">0</span></h2>
      <div id="recentList" class="recent-list">
        <div class="empty">No check-ins yet this session.</div>
      </div>
    </div>

    <p style="text-align: center; padding: 16px; font-size: 11px; color: var(--muted);">
      GTA Volunteer Check-in · Each scan logs you (<span id="adminFooter">—</span>) as the admin.
    </p>
  </main>
</div>

<script src="config.js"></script>
<script>
  let currentPin = '';
  let adminName = '';
  let scanner = null;
  let isProcessing = false;
  const recent = [];

  // ---- Lock screen ----
  document.getElementById('lockForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pin = document.getElementById('pinInput').value.trim();
    const name = document.getElementById('adminNameInput').value.trim();
    if (!pin) { document.getElementById('lockErr').textContent = 'Enter the admin PIN.'; return; }
    if (!name) { document.getElementById('lockErr').textContent = 'Enter your name.'; return; }
    document.getElementById('lockErr').textContent = '';

    // Validate PIN by making a quick lookup with a fake token (we'll just probe auth)
    try {
      const probe = await callBackend('lookupVolunteer', { adminPin: pin, token: 'PROBE-AUTH' });
      // Either gets "Invalid PIN" or "No registration found" — second is OK because PIN matched
      if (probe.status === 'error' && /invalid admin pin/i.test(probe.message)) {
        document.getElementById('lockErr').textContent = 'Invalid PIN.';
        return;
      }
      currentPin = pin;
      adminName = name;
      sessionStorage.setItem('checkinPin', pin);
      sessionStorage.setItem('checkinAdminName', name);
      enterApp();
    } catch (err) {
      document.getElementById('lockErr').textContent = 'Network error. Try again.';
    }
  });

  function enterApp() {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('appContent').style.display = 'block';
    document.getElementById('adminMeta').textContent = '👤 ' + adminName;
    document.getElementById('adminFooter').textContent = adminName;
    initScanner();
  }

  function logout() {
    currentPin = ''; adminName = '';
    sessionStorage.removeItem('checkinPin');
    sessionStorage.removeItem('checkinAdminName');
    if (scanner) { try { scanner.clear(); } catch (e) {} }
    location.reload();
  }

  // Auto-restore session
  window.addEventListener('load', () => {
    const savedPin = sessionStorage.getItem('checkinPin');
    const savedName = sessionStorage.getItem('checkinAdminName');
    if (savedPin && savedName) {
      currentPin = savedPin;
      adminName = savedName;
      enterApp();
    }
  });

  // ---- Backend ----
  async function callBackend(action, payload) {
    const res = await fetch(CONFIG.appsScriptUrl, {
      method: 'POST', mode: 'cors', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action }, payload))
    });
    if (!res.ok) throw new Error('Network error (' + res.status + ')');
    return res.json();
  }

  // ---- QR Scanner ----
  function initScanner() {
    if (scanner) return;
    scanner = new Html5QrcodeScanner('qr-reader', {
      fps: 10,
      qrbox: { width: 240, height: 240 },
      rememberLastUsedCamera: true,
      supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
    }, false);
    scanner.render(onScanSuccess, onScanError);
  }

  async function onScanSuccess(decodedText) {
    if (isProcessing) return;
    if (!decodedText) return;
    isProcessing = true;
    flash('Scanned: ' + decodedText.substring(0, 40), 'success');
    try {
      await lookupAndShow(decodedText.trim());
    } finally {
      // Allow next scan after a short delay
      setTimeout(() => { isProcessing = false; }, 1500);
    }
  }

  function onScanError() { /* per-frame errors are noisy; ignore */ }

  // ---- Manual fallback ----
  async function lookupManual() {
    const token = (document.getElementById('manualToken').value || '').trim().toUpperCase();
    if (!token) return;
    document.getElementById('manualToken').value = '';
    await lookupAndShow(token);
  }

  // ---- Lookup + render volunteer card ----
  async function lookupAndShow(token) {
    const area = document.getElementById('volunteerArea');
    area.innerHTML = '<div class="card"><div class="empty">Looking up volunteer…</div></div>';

    try {
      const res = await callBackend('lookupVolunteer', { adminPin: currentPin, token: token });
      if (res.status !== 'ok') {
        flash(res.message || 'Lookup failed', 'error');
        area.innerHTML = '<div class="card"><div class="empty">' + escapeHtml(res.message || 'Lookup failed') + '</div></div>';
        return;
      }
      renderVolunteer(res.volunteer, token);
    } catch (err) {
      flash('Network error: ' + err.message, 'error');
    }
  }

  function renderVolunteer(v, token) {
    const area = document.getElementById('volunteerArea');
    const alreadyIn = !!v.checkedInAt;
    const cardClass = alreadyIn ? 'checked-in' : (hasMedical(v) ? 'warning' : '');
    const medicalRow = hasMedical(v) ? `
      <div class="medical">
        <strong>⚠️ Medical info on file:</strong><br>
        ${v.allergies        ? 'Allergies: '         + escapeHtml(v.allergies)         + '<br>' : ''}
        ${v.medicalConditions ? 'Conditions: '       + escapeHtml(v.medicalConditions) + '<br>' : ''}
        ${v.medications      ? 'Medications: '       + escapeHtml(v.medications)       + '' : ''}
      </div>` : '';

    area.innerHTML = `
      <div class="card volunteer-card ${cardClass}">
        <h2 class="name">
          ${escapeHtml(v.firstName + ' ' + v.lastName)}
          ${alreadyIn ? '<span class="badge badge-success">Already checked in</span>' : '<span class="badge badge-info">Pending</span>'}
        </h2>
        <p class="sub">${escapeHtml(v.schoolName || '—')}${v.gradeLevel ? ' · ' + escapeHtml(v.gradeLevel) : ''}${v.isStudent === 'No' ? ' · Adult volunteer' : ''}</p>

        <table>
          <tr><td class="label">Volunteer role</td><td><strong>${escapeHtml(v.role || '—')}</strong></td></tr>
          <tr><td class="label">Hours pledged</td><td>${escapeHtml(v.hoursPledged || '—')}</td></tr>
          <tr><td class="label">Parent/guardian</td><td>${escapeHtml(v.parentName || '—')}</td></tr>
          <tr><td class="label">Parent contact</td><td>${escapeHtml(v.parentEmail || '')}<br>${escapeHtml(v.parentPhone || '')}</td></tr>
          <tr><td class="label">Emergency</td><td>${escapeHtml(v.emergencyName || '—')} · ${escapeHtml(v.emergencyPhone || '')}</td></tr>
          ${alreadyIn ? `<tr><td class="label">Checked in at</td><td><strong>${escapeHtml(v.checkedInAt)}</strong> by ${escapeHtml(v.checkedInBy)}</td></tr>` : ''}
        </table>

        ${medicalRow}

        <div class="actions">
          ${alreadyIn
            ? '<button class="btn-secondary" onclick="clearVolunteer()">✓ Done — scan next</button>'
            : '<button class="btn-primary" id="confirmBtn" onclick="confirmCheckIn(\'' + token + '\')">✓ Confirm Check-in</button><button class="btn-secondary" onclick="clearVolunteer()">Cancel</button>'}
        </div>
      </div>
    `;
  }

  function hasMedical(v) {
    return (v.allergies || '').trim() || (v.medicalConditions || '').trim() || (v.medications || '').trim();
  }

  async function confirmCheckIn(token) {
    const btn = document.getElementById('confirmBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Confirming…'; }
    try {
      const res = await callBackend('confirmCheckIn', {
        adminPin: currentPin,
        token: token,
        adminName: adminName
      });
      if (res.status !== 'ok') {
        flash(res.message || 'Check-in failed', 'error');
        if (btn) { btn.disabled = false; btn.textContent = '✓ Confirm Check-in'; }
        return;
      }
      const name = (res.firstName + ' ' + res.lastName).trim();
      if (res.alreadyCheckedIn) {
        flash('⚠️ ' + name + ' was already checked in at ' + res.checkedInAt, 'warning');
      } else {
        flash('✅ ' + name + ' checked in successfully!', 'success');
        recent.unshift({ name: name, time: res.checkedInAt, by: res.checkedInBy });
        renderRecent();
      }
      // Auto-clear card and prepare for next scan
      setTimeout(clearVolunteer, 1500);
    } catch (err) {
      flash('Network error: ' + err.message, 'error');
      if (btn) { btn.disabled = false; btn.textContent = '✓ Confirm Check-in'; }
    }
  }

  function clearVolunteer() {
    document.getElementById('volunteerArea').innerHTML = '';
  }

  function renderRecent() {
    const list = document.getElementById('recentList');
    if (recent.length === 0) {
      list.innerHTML = '<div class="empty">No check-ins yet this session.</div>';
      document.getElementById('recentCount').textContent = '0';
      return;
    }
    list.innerHTML = recent.slice(0, 20).map(r =>
      '<div class="row"><div><div class="name">' + escapeHtml(r.name) + '</div><div class="time">by ' + escapeHtml(r.by) + '</div></div><div class="time">' + escapeHtml(r.time) + '</div></div>'
    ).join('');
    document.getElementById('recentCount').textContent = String(recent.length);
  }

  function flash(msg, kind) {
    const banner = document.getElementById('statusBanner');
    banner.className = 'status-banner ' + (kind || 'success');
    banner.textContent = msg;
    setTimeout(() => { banner.style.display = 'none'; banner.className = 'status-banner'; }, 4000);
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
</script>

</body>
</html>
